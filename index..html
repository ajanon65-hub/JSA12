<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدرسة أحمد زويل الخاصة للمرحلة الثانوية - منصة الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0b3d91;
  --brand2:#a6192e;
  --gold:#c9a227;
  --bg:#eef3f4;
  --card:#ffffff;
  --ink:#14262b;
  --muted:#5f7379;
  --line:#d6e0e2;
  --danger:#c0392b;
  --ok-bg:#dff3ea;
  --ok-ink:#116a4a;
  --bad-bg:#fbe4e1;
  --bad-ink:#a5281b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
#app{max-width:820px;margin:0 auto;padding:14px 14px 40px}

/* header */
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:linear-gradient(135deg,var(--brand),#08285f);color:#fff;
  padding:12px 16px;border-radius:14px;
}
.brand{display:flex;align-items:center;gap:10px}
.mark img{width:48px;height:48px;border-radius:10px;display:block;background:#fff;object-fit:cover}
.brand .name{font-weight:800;font-size:17px;line-height:1.25}
.brand .sub{font-size:11px;opacity:.9}
.credit{font-size:10.5px;opacity:.8;font-style:italic;margin-top:2px}
.login-box .credit{font-size:12px;color:var(--muted);font-style:italic;margin:0 0 10px}
.topbar button.ghost{color:#fff;border-color:rgba(255,255,255,.55)}
.ribbon{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.18);margin-inline-start:6px}
.toolbtns{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}

/* tabs */
.tabs{
  display:flex;gap:4px;overflow-x:auto;margin:12px 0;
  border-bottom:2px solid var(--line);
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;white-space:nowrap;cursor:pointer;
  padding:10px 14px;font-weight:600;color:var(--muted);
  border-bottom:3px solid transparent;margin-bottom:-2px;
}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.dot{
  display:inline-block;min-width:18px;height:18px;padding:0 5px;
  margin-inline-start:6px;border-radius:9px;
  background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center;
}

/* cards & list */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px;margin-bottom:12px;
}
.card h3{margin:0 0 10px;font-size:17px}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.muted{color:var(--muted);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:40px 12px}

/* forms */
input,select,textarea{
  font-family:inherit;font-size:15px;color:var(--ink);
  width:100%;padding:10px 12px;margin:0 0 10px;
  border:1px solid var(--line);border-radius:10px;background:#fff;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
textarea{resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 10px}
button{
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 18px;
}
button:hover{background:#08285f}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.6;cursor:wait}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button.ghost:hover{background:rgba(11,61,145,.08)}
button.small{font-size:13px;padding:4px 12px}

/* badges */
.badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink)}
.badge.bad{background:var(--bad-bg);color:var(--bad-ink)}
.badge.year{background:#e3eaf5;color:var(--brand)}

/* admin lists */
.item{overflow-wrap:anywhere}
.item.hide{display:none !important}
.arow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.arow > div{min-width:0}
.badge.by{background:#fbeecb;color:#7a5410}

/* submissions */
.subbox{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.subbox textarea,.subbox input{margin:0 0 8px}
details summary{cursor:pointer;font-weight:700;color:var(--brand)}

/* attachments */
.attach{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
a.linkbtn{display:inline-block;font-size:13px;font-weight:700;padding:4px 12px;border-radius:10px;border:1px solid var(--brand);color:var(--brand);text-decoration:none}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.note{white-space:pre-wrap}

/* chat */
.chatbox{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:10px}
.msg{padding:8px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.msg.admin{border-color:var(--brand);background:rgba(11,61,145,.06)}
.msg-meta{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.msg-text{white-space:pre-wrap}
.grouplist label.item{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0}

/* login */
.login-box{max-width:400px;margin:2vh auto 0;text-align:center;padding:28px 22px}
.login-box .mark img{width:88px;height:88px;margin:0 auto 6px;object-fit:cover}
.login-box h2{margin:6px 0 2px;font-size:24px;font-weight:800}
.login-box p{margin:4px 0 12px}

:root[data-theme="dark"]{
  --bg:#0f1b1e;--card:#172629;--ink:#e7f0f1;--muted:#93a9ae;--line:#26393d;
  --ok-bg:#12352a;--ok-ink:#7fdcb5;--bad-bg:#3a1b17;--bad-ink:#f0a79f;
}
:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] textarea{background:#101d20}
:root[data-theme="dark"] .badge.year{background:#1d2c44;color:#9db8ec}
:root[data-theme="dark"] .badge.by{background:#3a2f14;color:#f0cf8a}
:root[data-theme="dark"] button.ghost,:root[data-theme="dark"] a.linkbtn{color:#9db8ec;border-color:#9db8ec}
:root[data-theme="dark"] .topbar button.ghost{color:#fff}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0f1b1e;--card:#172629;--ink:#e7f0f1;--muted:#93a9ae;--line:#26393d;
    --ok-bg:#12352a;--ok-ink:#7fdcb5;--bad-bg:#3a1b17;--bad-ink:#f0a79f;
  }
  :root:not([data-theme="light"]):not([data-theme="dark"]) input,
  :root:not([data-theme="light"]):not([data-theme="dark"]) select,
  :root:not([data-theme="light"]):not([data-theme="dark"]) textarea{background:#101d20}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .badge.year{background:#1d2c44;color:#9db8ec}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .badge.by{background:#3a2f14;color:#f0cf8a}
  :root:not([data-theme="light"]):not([data-theme="dark"]) button.ghost,
  :root:not([data-theme="light"]):not([data-theme="dark"]) a.linkbtn{color:#9db8ec;border-color:#9db8ec}
  :root:not([data-theme="light"]):not([data-theme="dark"]) .topbar button.ghost{color:#fff}
}
</style>
</head>

function applyThemeLang(){
  const html=document.documentElement;
  if(theme==='light') html.setAttribute('data-theme','light');
  else if(theme==='dark') html.setAttribute('data-theme','dark');
  else html.removeAttribute('data-theme');
  html.lang = lang==='en' ? 'en' : 'ar';
  html.dir = lang==='en' ? 'ltr' : 'rtl';
}
function themeIcon(){ return theme==='light' ? '☀️' : theme==='dark' ? '🌙' : '🖥️'; }
function toggleTheme(){
  theme = theme==='system' ? 'light' : theme==='light' ? 'dark' : 'system';
  try{ localStorage.setItem('jsa_theme', theme); }catch(e){}
  applyThemeLang(); render();
}
function toggleLang(){
  lang = lang==='ar' ? 'en' : 'ar';
  try{ localStorage.setItem('jsa_lang', lang); }catch(e){}
  applyThemeLang(); render();
}
window.toggleTheme=toggleTheme; window.toggleLang=toggleLang;
applyThemeLang();

function toolBtns(dark){
  const c = dark ? 'color:#fff;border-color:rgba(255,255,255,.6)' : '';

}

function brandHeader(){
  return `<div class="brand"><div class="mark"><img src="${LOGO}" alt="Ahmed Zewail Schools"></div><div><div class="name">${t('brand_name')}</div><div class="sub">${t('brand_sub')}</div><div class="credit">${t('credit')}</div></div></div>`;
}

function loginView(){
  return `
  <div style="max-width:400px;margin:2vh auto 0;padding:0 8px">${toolBtns(false)}</div>
  <div class="login-box card">
    <div class="mark"><img src="${LOGO}" alt="Ahmed Zewail Schools" style="border-radius:16px"></div>
    <h2 style="background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent">${t('brand_name')}</h2>
    <p class="muted">${t('brand_sub')}</p>
    <p class="credit">${t('credit')}</p>
    <p class="muted">${t('login_hint')}</p>
    <input id="loginCode" placeholder="${t('login_placeholder')}" autocapitalize="characters" autocomplete="off" style="text-align:center;font-size:18px;letter-spacing:2px">
    <button style="width:100%" id="loginBtn">${t('login_btn')}</button>
    <p id="loginErr" style="color:var(--danger);font-size:13px;margin-top:8px"></p>
  </div>`;
}

function attachLogin(){
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('loginCode').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const code = document.getElementById('loginCode').value.trim();
  const errEl = document.getElementById('loginErr');
  if(!code){ errEl.textContent='اكتب الكود أولاً'; return; }
  if(code === 'ADMIN2026'){ session={role:'admin',code,unlocked:{}}; currentTab='students'; activeGroupId=null; render(); return; }
  try{
    let code2 = code;
    let doc = await db.doc('students/'+code2).get();
    if(!doc.exists && code.toUpperCase()!==code){ code2 = code.toUpperCase(); doc = await db.doc('students/'+code2).get(); }
    if(!doc.exists){ errEl.textContent='الكود غير صحيح، راجع كودك مع المدرسة'; return; }
    const d=doc.data();
    session={role:'student', code:code2, name:d.name, year:d.year, track:d.track, system:d.system, subject:d.subject, classLabel:(d.classLabel||'').trim()};
    currentTab='home';
    activeGroupId=null;
    await computeUnseen();
    render();
  }catch(e){ errEl.textContent='الكود غير صحيح أو غير مسجل بعد'; }
}

async function computeUnseen(){
  try{
    const nDoc = await db.doc('notifications/'+session.code).get();
    liveTotals.notifications = (nDoc?.data()?.items||[]).length;
    const nSeen = Number(localStorage.getItem('seen_notifications_'+session.code)||0);
    unseenCounts.notifications = Math.max(0, liveTotals.notifications - nSeen);

    const aDoc = await db.doc('activities/all').get();
    liveTotals.activities = (aDoc?.data()?.items||[]).length;
    const aSeen = Number(localStorage.getItem('seen_activities_'+session.code)||0);
    unseenCounts.activities = Math.max(0, liveTotals.activities - aSeen);
  }catch(e){}
}

function markSeen(key){
  try{ localStorage.setItem('seen_'+key+'_'+session.code, liveTotals[key]); }catch(e){}
  unseenCounts[key]=0;
  const dot = document.querySelector('.tab[data-tab="'+key+'"] .dot');
  if(dot) dot.remove();
}

function logout(){ session=null; activeGroupId=null; render(); }

function shell(){
  const tabs = session.role==='admin'
    ? [['students',t('tab_students')],['assignments',t('tab_assignments')],['grades',t('tab_grades_admin')],['attendance',t('tab_attendance')],['activities',t('tab_activities_admin')],['schedule',t('tab_schedule')],['classinfo',t('tab_classinfo')],['chat',t('tab_chat_admin')]]
    : [['home',t('tab_home')],['assignments',t('tab_assignments')],['grades',t('tab_grades_student')],['schedule',t('tab_schedule')],['attendance',t('tab_attendance')],['activities',t('tab_activities_student')],['chat',t('tab_chat_student')],['notifications',t('tab_notifications')]];
  return `
  <div class="topbar">
    ${brandHeader()}
    <div style="text-align:end">
      ${toolBtns(true)}
      <div style="font-weight:700">${session.role==='admin'?t('admin_panel'):session.name}</div>
      <button class="ghost small" onclick="logout()">${t('logout')}</button>
    </div>
  </div>
  <div class="tabs">${tabs.map(tb=>`<div class="tab ${currentTab===tb[0]?'active':''}" data-tab="${tb[0]}">${tb[1]}${unseenCounts[tb[0]]?`<span class="dot">${unseenCounts[tb[0]]}</span>`:''}</div>`).join('')}</div>
  <div id="tabContent"><div class="empty">تحميل...</div></div>`;
}

function attachShell(){
  document.querySelectorAll('.tab').forEach(tb=>tb.onclick=()=>{ currentTab=tb.dataset.tab; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); tb.classList.add('active'); loadTab(); });
  loadTab();
}

async function loadTab(){
  const c = document.getElementById('tabContent');
  c.innerHTML = '<div class="empty">تحميل...</div>';
  try{
    if(session.role==='admin') c.innerHTML = await adminTab(currentTab);
    else c.innerHTML = await studentTab(currentTab);
  }catch(e){ c.innerHTML = '<div class="empty">حصل خطأ في تحميل البيانات، حاول تاني</div>'; }
  bindTabActions();
}

// ---------- ADMIN LIST HELPERS ----------
const LIST_LIMIT = 150;
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const TITLE_RE = /^(مس|مستر|ميس|مسز|أستاذ|استاذ|أستاذة|استاذة|دكتور|دكتورة)\s+\S/;
function byLabel(by){ by=String(by||'').trim(); return TITLE_RE.test(by) ? by : 'مس '+by; }
function lastBy(){ try{ const v=localStorage.getItem('jsa_lastBy')||''; return TITLE_RE.test(v)?v:''; }catch(e){ return ''; } }
function readBy(id){
  const v=cleanBy(document.getElementById(id).value);
  if(!v){ alert('اكتبي تبع مين (مثال: مس سارة أو مستر أحمد)'); return null; }
  if(!TITLE_RE.test(v)){ alert('اكتبي مس أو مستر قبل الاسم (مثال: مس سارة / مستر أحمد)'); return null; }
  saveBy(v); return v;
}
function saveBy(v){ try{ localStorage.setItem('jsa_lastBy', v); }catch(e){} }
function cleanBy(v){ return (v||'').trim().replace(/\s+/g,' '); }
function fmtAt(tms){ if(!tms) return ''; try{ return new Date(tms).toLocaleDateString('ar-EG',{day:'numeric',month:'long'}); }catch(e){ return ''; } }

async function deleteFile(fileId){
  try{
    const m = await db.doc('files/'+fileId).get();
    if(m.exists){
      const n = m.data().parts||0;
      for(let k=0;k<n;k++) await db.doc('files/'+fileId+'_p'+k).delete();
      await db.doc('files/'+fileId).delete();
    }
  }catch(e){}
}

// ---------- CODE GENERATOR ----------
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const TRACK_PREFIX = {'طب':'MED','هندسة':'ENG','آداب':'ART','إدارة أعمال':'BUS','علمي':'SCI','أدبي':'LIT','ثانوية عامة':'GEN'};
const TRACK_TO_SYSTEM = {'طب':'بكالوريا','هندسة':'بكالوريا','آداب':'بكالوريا','إدارة أعمال':'بكالوريا','علمي':'ثانوي عام','أدبي':'ثانوي عام','ثانوية عامة':'ثانوي عام'};
function randPart(n){
  const a = new Uint32Array(n); crypto.getRandomValues(a);
  return Array.from(a, x=>CODE_CHARS[x % CODE_CHARS.length]).join('');
}
function makeCode(track, taken){
  const p = TRACK_PREFIX[track] || 'STD';
  let c; do{ c = p+'-'+randPart(5); }while(taken.has(c));
  taken.add(c); return c;
}

// ---------- PDF / LINK HELPERS ----------
const MAX_PDF_MB = 5;
const CHUNK_SIZE = 800000;

function attachHtml(i){
  let h='';
  if(i.fileId) h+=`<button class="ghost small openFile" data-id="${i.fileId}" data-name="${encodeURIComponent(i.fileName||'file.pdf')}">📄 فتح الملف</button>`;
  if(i.link) h+=`<a class="linkbtn" href="${i.link}" target="_blank" rel="noopener">🔗 فتح الرابط</a>`;
  return h?`<div class="attach">${h}</div>`:'';
}

async function openFile(id,name){
  const w = window.open('','_blank');
  try{
    const snap = await db.doc('files/'+id).get();
    if(!snap.exists) throw new Error('missing');
    const meta = snap.data();
    let dataUrl = meta.data;
    if(!dataUrl){
      const parts = await Promise.all(Array.from({length:meta.parts}, (_,k)=>db.doc('files/'+id+'_p'+k).get()));
      dataUrl = parts.map(p=>p.data().data).join('');
    }
    const blob = await (await fetch(dataUrl)).blob();
    const url = URL.createObjectURL(blob);
    if(w){ w.location.href = url; }
    else { const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(e){ if(w) w.close(); alert('تعذر فتح الملف، حاول تاني'); }
}

function readDataUrl(f){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
}
async function compressImage(f){
  const url = await readDataUrl(f);
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('مش قادرة أقرا الصورة دي، جرّبي صورة تانية')); i.src=url; });
  const k = Math.min(1, 1600/Math.max(img.width,img.height));
  const w = Math.round(img.width*k), h = Math.round(img.height*k);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',0.72);
}
async function storeFile(f, opts){
  const allowImages = !!(opts && opts.allowImages);
  const isPdf = /\.pdf$/i.test(f.name) || f.type==='application/pdf';
  const isImg = /^image\//.test(f.type) || /\.(jpe?g|png|webp)$/i.test(f.name);
  if(!isPdf && !(allowImages && isImg)) throw new Error(allowImages ? 'الملف لازم يكون PDF أو صورة' : 'الملف لازم يكون PDF');
  let dataUrl, name=f.name;
  if(isPdf){
    if(f.size > MAX_PDF_MB*1024*1024) throw new Error('حجم الملف كبير (الأقصى '+MAX_PDF_MB+' ميجا). صغّر الملف أو استخدم رابط بدله');
    dataUrl = (await readDataUrl(f)).replace(/^data:[^;]*;/,'data:application/pdf;');
  }else{
    dataUrl = await compressImage(f);
    name = name.replace(/\.\w+$/,'')+'.jpg';
    if(dataUrl.length > MAX_PDF_MB*1.4*1024*1024) throw new Error('الصورة كبيرة جداً');
  }
  const id = 'f'+Date.now()+Math.random().toString(36).slice(2,7);
  const n = Math.ceil(dataUrl.length / CHUNK_SIZE);
  for(let k=0;k<n;k++){
    await db.doc('files/'+id+'_p'+k).set({data: dataUrl.slice(k*CHUNK_SIZE,(k+1)*CHUNK_SIZE)});
  }
  await db.doc('files/'+id).set({name, parts:n});
  return {fileId:id, fileName:name};
}
async function readPdf(inputId, opts){
  const f = document.getElementById(inputId).files[0];
  if(!f) return null;
  return storeFile(f, opts);
}

function cleanLink(v){
  v=(v||'').trim();
  if(!v) return '';
  if(!/^https?:\/\//i.test(v)) throw new Error('الرابط لازم يبدأ بـ http أو https');
  return v;
}

// ---------- ASSIGNMENT SUBMISSIONS ----------
function aid(i){
  if(i.id) return i.id;
  const str=[i.subject,i.title,i.due].join('|'); let h=0;
  for(const ch of str){ h=(h*31+ch.charCodeAt(0))|0; }
  return 'L'+Math.abs(h).toString(36);
}
function fileBtn(f){
  return `<button class="ghost small openFile" data-id="${esc(f.fileId)}" data-name="${encodeURIComponent(f.fileName||'file')}">📎 ${esc((f.fileName||'ملف').slice(0,28))}</button>`;
}
function submitHtml(i, sub){
  const id=aid(i);
  let h='<div class="subbox">';
  if(sub){
    h+=`<div><span class="badge ok">✅ تم التسليم</span> <span class="muted">${fmtAt(sub.at)}</span></div>`;
    if(sub.text) h+=`<div class="note">${esc(sub.text)}</div>`;
    if((sub.files||[]).length) h+=`<div class="attach">${sub.files.map(fileBtn).join('')}</div>`;
    if((sub.grade!=null && sub.grade!=='') || sub.feedback || sub.correct===false || sub.correct===true){
      h+=`<div class="note" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">
        <span class="badge ${sub.correct?'ok':'bad'}">${sub.correct?'✔ إجابة صحيحة':'⚠ فيه ملاحظات'}</span>
        ${(sub.grade!=null && sub.grade!=='')?' — الدرجة: '+esc(sub.grade):''}
        ${sub.feedback?`<div style="margin-top:6px">${esc(sub.feedback)}</div>`:''}
      </div>`;
    }
  }
  h+=`<button class="ghost small openSubmit" data-aid="${id}">${sub?'✏️ تعديل التسليم':'📤 تسليم الواجب'}</button>
    <div class="submitForm" id="sf_${id}" style="display:none;width:100%">
      <textarea rows="3" placeholder="اكتب إجابتك هنا (اختياري لو هترفع ملف)"></textarea>
      <label class="lbl">ارفع صورة الواجب أو PDF (لحد 5 ملفات)</label>
      <input type="file" multiple accept="application/pdf,.pdf,image/*">
      <button class="doSubmit" data-aid="${id}" style="width:100%">تسليم</button>
    </div></div>`;
  return h;
}

}
async function getGroupMessages(gid){
  try{ const d=await db.doc('groupMessages/'+gid).get(); return (d?.data()?.items)||[]; }catch(e){ return []; }
}
async function postGroupMessage(gid, text){
  const ref=db.doc('groupMessages/'+gid);
  const cur=await ref.get();
  const items=(cur?.data()?.items)||[];
  items.push({code:session.code, name:session.role==='admin'?(lang==='en'?'Admin':'الإدارة'):session.name, role:session.role, text, at:Date.now()});
  if(items.length>300) items.splice(0, items.length-300);
  await ref.set({items});
}
async function myGroupsFor(){
  const groups=[];
  if(session.classLabel){
    groups.push({id:classGroupId(session.year, session.classLabel), name:(lang==='en'?'Class ':'فصل ')+session.classLabel});
  }
  const custom = await loadCustomGroups();
  custom.filter(g=>Array.isArray(g.members)&&g.members.includes(session.code)).forEach(g=>groups.push(g));
  return groups;
}

          ${x.text?`<div class="note">${esc(x.text)}</div>`:''}

      <input id="aLink" type="url" dir="ltr" placeholder="أو رابط ملف (Google Drive مثلاً) - اختياري">

    return `<div class="card"><h3>تسجيل حضور/غياب</h3>
      <div class="row"><input id="atCode" list="stuList" dir="ltr" placeholder="كود الطالب (أو اكتبي أول حروف الاسم)"><input id="atDate" placeholder="التاريخ (مثال: ١٨ سبتمبر)">
      <select id="atStatus"><option value="حاضر">حاضر</option><option value="غائب">غائب</option></select></div>
      ${studentsDatalist(sdocs)}
      ${byInput('atBy')}
      <textarea id="atMsg" rows="2" placeholder="رسالة خاصة للطالب (اختياري)"></textarea>
      <button id="addAttendance">حفظ + إرسال إشعار</button>
      <p class="muted" style="margin:10px 0 0">كل طالب بيوصله إشعار خاص بيه هو بس، ومحدش بيشوف حضور غيره.</p></div>
      <div class="card"><h3>سجل الحضور (${total})</h3>
      ${total?filterBox('atList'):''}
      <div id="atList">${rows.length?rows.map(r=>adminRow(`<b>${esc(names[r.code]||'(كود غير مسجل)')}</b> — <span dir="ltr" style="font-weight:700;color:var(--brand)">${esc(r.code)}</span><div>${esc(r.it.date)} <span class="badge ${r.it.status==='حاضر'?'ok':'bad'}">${esc(r.it.status)}</span></div>${r.it.msg?`<div class="note muted">${esc(r.it.msg)}</div>`:''}<div>${byBadge(r.it)}</div>`, delBtn('attendance/'+r.code,'records',r.idx,'attendance'))).join(''):'<div class="empty">لسه مفيش سجل حضور</div>'}</div>
      ${total>LIST_LIMIT?`<p class="muted">بيظهر آخر ${LIST_LIMIT} سجل بس.</p>`:''}</div>`;
  }
  if(tab==='activities'){
    const doc=await db.doc('activities/all').get();
    const items=doc?.data()?.items||[];
    const rows=items.map((it,idx)=>({it,idx})).reverse().sort(byTime);
    return `<div class="card"><h3>إضافة نشاط/حدث للمدرسة</h3>
      <div class="row"><input id="acTitle" placeholder="عنوان النشاط"><input id="acDate" placeholder="التاريخ"></div>
      ${byInput('acBy')}
      <textarea id="acDesc" placeholder="تفاصيل النشاط" rows="2"></textarea>
      <button id="addActivity">نشر للجميع</button></div>
      <div class="card"><h3>الأنشطة المنشورة (${items.length})</h3>
      ${rows.length?rows.map(r=>adminRow(`<b>${esc(r.it.title)}</b><div class="muted">${esc(r.it.date||'')}</div>${r.it.desc?`<div class="note">${esc(r.it.desc)}</div>`:''}<div>${byBadge(r.it)}</div>`, delBtn('activities/all','items',r.idx,'activity'))).join(''):'<div class="empty">لسه مفيش أنشطة</div>'}</div>`;
  }
  if(tab==='schedule'){
    const docs = await Promise.all([1,2,3].map(y=>db.doc('schedule/y'+y).get()));
    const yrs=['','أولى ثانوي','تانية ثانوي','تالتة ثانوي'];
    return `<div class="card"><h3>رفع الجدول الدراسي</h3>
      <select id="scYear"><option value="1">أولى ثانوي</option><option value="2">تانية ثانوي</option><option value="3">تالتة ثانوي</option></select>
      <label class="lbl" for="scFile">صورة الجدول أو PDF</label>
      <input id="scFile" type="file" accept="application/pdf,.pdf,image/*">
      <input id="scLink" type="url" dir="ltr" placeholder="أو رابط (اختياري)">
      <button id="uploadSchedule">حفظ الجدول</button></div>
      <div class="card"><h3>الجداول المرفوعة</h3>
      ${[1,2,3].map((y,i)=>{
        const d=docs[i]?.data();
        if(!d || (!d.fileId && !d.link)) return `<div class="item"><b>${yrs[y]}</b><div class="muted">لسه مفيش جدول مرفوع</div></div>`;
        return `<div class="item arow"><div><b>${yrs[y]}</b>${attachHtml(d)}</div><button class="ghost small delSchedule" data-year="${y}" data-fileid="${d.fileId||''}">حذف</button></div>`;
      }).join('')}
      </div>`;
  }
  if(tab==='classinfo'){
    const ss = await db.collection('students').get();
    const docs = ss?.docs||[];
    const combos = {};
    docs.forEach(d=>{ const y=Number(d.data().year); const cl=(d.data().classLabel||'').trim(); if(!cl) return; const k=y+'_'+cl; combos[k]=combos[k]||{year:y,classLabel:cl,count:0}; combos[k].count++; });
    const keys = Object.keys(combos).sort();
    const infoDocs = await Promise.all(keys.map(k=>db.doc('classInfo/'+k).get()));
    const yrs=['','أولى ثانوي','تانية ثانوي','تالتة ثانوي'];
    return `<div class="card"><h3>بيانات قيادة الفصول</h3>
      <p class="muted">حددي رائد الفصل والأمين والأمين المساعد لكل فصل، وهيظهروا للطلاب أول ما يدخلوا التطبيق.</p></div>
      ${keys.length? keys.map((k,i)=>{
         const d=combos[k]; const cur=infoDocs[i]?.data()||{};
         return `<div class="card">
           <h3>${yrs[d.year]} - فصل ${esc(d.classLabel)} <span class="muted">(${d.count} طالب)</span></h3>
           <div class="row">
             <input class="ciCaptain" placeholder="رائد الفصل" value="${esc(cur.captain||'')}">
             <input class="ciSecretary" placeholder="الأمين" value="${esc(cur.secretary||'')}">
             <input class="ciDeputy" placeholder="الأمين المساعد" value="${esc(cur.deputy||'')}">
           </div>
           <button class="small saveClassInfo" data-key="${k}">حفظ بيانات الفصل</button>
         </div>`;
       }).join('') : '<div class="empty">لسه مفيش فصول محددة. سجّلي رمز الفصل مع الطلاب الأول (خانة رمز الفصل عند إضافة الطلاب).</div>'}`;
  }
  if(tab==='chat'){
    const [ss, customGroups] = await Promise.all([db.collection('students').get(), loadCustomGroups()]);
    const docs = ss?.docs||[];
    const allGroups = customGroups;
    if(activeGroupId && !allGroups.some(g=>g.id===activeGroupId)) activeGroupId=null;
    if(!activeGroupId && allGroups.length) activeGroupId = allGroups[0].id;
    const listHtml = `<div class="card"><h3>المجموعات المخصصة</h3>
      ${allGroups.length? allGroups.map(g=>`<div class="item arow"><div><b>${esc(g.name)}</b>${g.count?` <span class="muted">(${g.count} طالب)</span>`:''}${g.custom?' <span class="badge by">مجموعة مخصصة</span>':''}</div>
        <div><button class="small openChatGroup" data-gid="${g.id}">فتح المحادثة</button>${g.custom?` <button class="ghost small delGroup" data-gid="${g.id}">حذف</button>`:''}</div></div>`).join('') : '<div class="empty">لسه مفيش مجموعات، أنشئي واحدة تحت</div>'}
      </div>`;
    const createHtml = `<div class="card"><h3>إنشاء مجموعة مخصصة</h3>
      <input id="grpName" placeholder="اسم المجموعة">
      ${filterBox('grpStudentList')}
      <div id="grpStudentList" class="grouplist" style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:10px">
        ${docs.map(d=>`<label class="item"><input type="checkbox" class="grpMember" value="${d.id}"> <span>${esc(d.data().name)} — <span dir="ltr">${esc(d.id)}</span></span></label>`).join('')}
      </div>
      <button id="createGroup">إنشاء المجموعة</button></div>`;
    let chatSection='';
    if(activeGroupId){
      const g = allGroups.find(x=>x.id===activeGroupId);
      const msgs = await getGroupMessages(activeGroupId);
      chatSection = chatHtml(activeGroupId, g?g.name:activeGroupId, msgs, true);
    }
    return listHtml + createHtml + chatSection;
  }
}

function bindTabActions(){
  const on=(id,fn)=>{ const e=document.getElementById(id); if(e) e.onclick=fn; };

  document.querySelectorAll('.openFile').forEach(b=>b.onclick=()=>openFile(b.dataset.id, decodeURIComponent(b.dataset.name)));

  on('unlockYear', ()=>{
    const y=Number(document.getElementById('gLockYear').value);
    const v=document.getElementById('gLockPass').value.trim().toLowerCase();
    const real=String(GRADE_PASSWORDS[y]||'').toLowerCase();
    if(real && v===real){ session.unlocked[y]=true; loadTab(); }
    else document.getElementById('gLockErr').textContent='الباسورد غير صحيح';
  });
  on('lockAll', ()=>{ session.unlocked={}; loadTab(); });
  const lp=document.getElementById('gLockPass');
  if(lp) lp.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('unlockYear').click(); });

  // ----- تسليم الواجب (الطالب) -----
  document.querySelectorAll('.openSubmit').forEach(b=>b.onclick=()=>{
    const box=document.getElementById('sf_'+b.dataset.aid);
    if(box) box.style.display = box.style.display==='none' ? 'block' : 'none';
  });
  document.querySelectorAll('.doSubmit').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.aid; const box=document.getElementById('sf_'+id);
    const text=box.querySelector('textarea').value.trim();
    const files=Array.from(box.querySelector('input[type=file]').files||[]);
    if(!text && !files.length) return alert('اكتب إجابتك أو ارفع صورة/ملف');
    if(files.length>5) return alert('أقصى عدد 5 ملفات');
    b.disabled=true; b.textContent='جاري التسليم...';
    try{
      const ref=db.doc('submissions/'+id+'_'+session.code);
      const old=await ref.get();
      const stored=[]; for(const f of files) stored.push(await storeFile(f,{allowImages:true}));
      const oldFiles = old.exists ? (old.data().files||[]) : [];
      if(stored.length) for(const f of oldFiles) await deleteFile(f.fileId);
      await ref.set({aid:id, code:session.code, name:session.name, year:session.year, text, files: stored.length?stored:oldFiles, at:Date.now()});
      alert('تم تسليم الواجب ✅'); loadTab();
    }catch(e){
      alert(e.message||'حصل خطأ، حاول تاني');
      b.disabled=false; b.textContent='تسليم';
    }
  });

  // ----- تقييم التسليم (الإدارة) -----
  document.querySelectorAll('.saveSubGrade').forEach(b=>b.onclick=async()=>{
    const code=b.dataset.code, aId=b.dataset.aid;
    const root=b.closest('details');
    const grade=root.querySelector('.gradeGradeInput').value.trim();
    const correct=root.querySelector('.gradeCorrectInput').value==='1';
    const feedback=root.querySelector('.gradeFeedbackInput').value.trim();
    b.disabled=true; b.textContent='جاري الحفظ...';
    try{
      const ref=db.doc('submissions/'+aId+'_'+code);
      await ref.set({grade, correct, feedback, gradedAt:Date.now()});
      alert('تم حفظ التقييم'); loadTab();
    }catch(e){ alert('فشل الحفظ، حاولي تاني'); b.disabled=false; b.textContent='حفظ التقييم'; }
  });

  document.querySelectorAll('.listFilter').forEach(inp=>inp.oninput=()=>{
    const q=inp.value.trim().toLowerCase();
    document.querySelectorAll('#'+inp.dataset.target+' .item').forEach(x=>x.classList.toggle('hide', !!q && !x.textContent.toLowerCase().includes(q)));
  });

  document.querySelectorAll('.delItem').forEach(b=>b.onclick=async()=>{
    if(!confirm('متأكدة إنك عايزة تحذفي ده؟ الحذف نهائي')) return;
    b.disabled=true;
    try{
      const ref=db.doc(b.dataset.path); const cur=await ref.get();
      const field=b.dataset.field; const arr=((cur?.data()||{})[field]||[]).slice();
      const removed=arr.splice(Number(b.dataset.idx),1)[0];
      await ref.set({[field]:arr});
      if(removed && removed.fileId) await deleteFile(removed.fileId);
      if(b.dataset.kind==='assignment' && removed){
        const id=aid(removed);
        const subs=(await db.collection('submissions').get())?.docs||[];
        for(const d of subs){
          if(d.data().aid===id){
            for(const f of (d.data().files||[])) await deleteFile(f.fileId);
            await db.doc('submissions/'+d.id).delete();
          }
        }
      }
      if(b.dataset.kind==='attendance' && removed){
        const code=b.dataset.path.split('/')[1];
        const nref=db.doc('notifications/'+code); const ncur=await nref.get();
        const nitems=((ncur?.data()||{}).items||[]).slice();
        const j=nitems.findIndex(n=>n.text===attText(removed) || n.text===`تسجيل حضور يوم ${removed.date}: ${removed.status}`);
        if(j>=0){ nitems.splice(j,1); await nref.set({items:nitems}); }
      }
    }catch(e){ alert('فشل الحذف، حاولي تاني'); }
    loadTab();
  });

  on('addStudent', async ()=>{
    const name=document.getElementById('sName').value.trim();
    const year=document.getElementById('sYear').value;
    const track=document.getElementById('sTrack').value.trim();
    const subject=document.getElementById('sSubject').value.trim();
    const classLabel=document.getElementById('sClass').value.trim();
    if(!name||!track) return alert('اكتب اسم الطالب والمسار');
    const btn=document.getElementById('addStudent'); btn.disabled=true; btn.textContent='جاري الحفظ...';
    try{
      const snap = await db.collection('students').get();
      const taken = new Set((snap?.docs||[]).map(d=>d.id));
      const code = makeCode(track, taken);
      await db.doc('students/'+code).set({name, year:Number(year), track, subject, classLabel, system: TRACK_TO_SYSTEM[track]||''});
      alert('تم الحفظ ✅\nكود '+name+':\n'+code);
      loadTab();
    }catch(e){
      alert('فشل الحفظ. تأكدي من الـ Rules في Firebase');
      btn.disabled=false; btn.textContent='حفظ الطالب وعمل الكود';
    }
  });

  on('addAssignment', async ()=>{
    const year=document.getElementById('aYear').value;
    const subject=document.getElementById('aSubject').value.trim();
    const title=document.getElementById('aTitle').value.trim();
    const due=document.getElementById('aDue').value.trim();
    const desc=document.getElementById('aDesc').value.trim();
    if(!subject||!title) return alert('اكتب المادة والواجب');
    const by=readBy('aBy'); if(!by) return;
    const btn=document.getElementById('addAssignment'); btn.disabled=true; btn.textContent='جاري الحفظ...';
    try{
      const link=cleanLink(document.getElementById('aLink').value);
      const file=await readPdf('aFile');
      const ref = db.doc('assignments/y'+year);
      const cur = await ref.get();
      const items = (cur?.data()?.items)||[];
      items.push({id:'a'+Date.now().toString(36)+randPart(3),subject,title,due,desc,link,by,at:Date.now(),...(file||{})});
      await ref.set({items});
      alert('تم حفظ الواجب'); loadTab();
    }catch(e){
      alert(e.message||'حصل خطأ، حاول تاني');
      btn.disabled=false; btn.textContent='حفظ الواجب';
    }
  });

  on('addGrade', async ()=>{
    const code=document.getElementById('gCode').value.trim();
    const subject=document.getElementById('gSubject').value.trim();
    const grade=document.getElementById('gGrade').value;
    const max=document.getElementById('gMax').value;
    const note=document.getElementById('gNote').value.trim();
    if(!code||!subject) return alert('اكتب كود الطالب والمادة');
    const by=readBy('gBy'); if(!by) return;
    const btn=document.getElementById('addGrade'); btn.disabled=true; btn.textContent='جاري الحفظ...';
    try{
      const link=cleanLink(document.getElementById('gLink').value);
      const hasFile=document.getElementById('gFile').files.length>0;
      if(grade===''&&!note&&!link&&!hasFile) throw new Error('اكتب درجة أو نص أو ارفع ملف/رابط');
      const sd=await db.doc('students/'+code).get();
      if(!sd.exists) throw new Error('كود الطالب ده مش مسجل');
      if(!(session.unlocked||{})[Number(sd.data().year)]) throw new Error('لازم تفتحي درجات سنة الطالب ده الأول');
      const file=await readPdf('gFile', {allowImages:true});
      const ref = db.doc('grades/'+code);
      const cur = await ref.get();
      const items = (cur?.data()?.items)||[];
      items.push({subject,grade,max,note,link,by,at:Date.now(),...(file||{})});
      await ref.set({items});
      alert('تم حفظ الدرجة'); loadTab();
    }catch(e){
      alert(e.message||'حصل خطأ، حاول تاني');
      btn.disabled=false; btn.textContent='حفظ الدرجة';
    }
  });

  on('addAttendance', async ()=>{
    const code=document.getElementById('atCode').value.trim();
    const date=document.getElementById('atDate').value.trim();
    const status=document.getElementById('atStatus').value;
    const msg=document.getElementById('atMsg').value.trim();
    if(!code||!date) return alert('اكتب كود الطالب والتاريخ');
    const by=readBy('atBy'); if(!by) return;
    const btn=document.getElementById('addAttendance'); btn.disabled=true; btn.textContent='جاري الحفظ...';
    try{
      const sd=await db.doc('students/'+code).get();
      if(!sd.exists) throw new Error('كود الطالب ده مش مسجل');
      const ref = db.doc('attendance/'+code);
      const cur = await ref.get();
      const records = (cur?.data()?.records)||[];
      const rec={date,status,by,at:Date.now(),msg};
      records.push(rec);
      await ref.set({records});
      const nref = db.doc('notifications/'+code);
      const ncur = await nref.get();
      const nitems = (ncur?.data()?.items)||[];
      nitems.push({text:attText(rec), date});
      await nref.set({items:nitems});
      alert('تم الحفظ وإرسال الإشعار'); loadTab();
    }catch(e){
      alert(e.message||'حصل خطأ، حاولي تاني');
      btn.disabled=false; btn.textContent='حفظ + إرسال إشعار';
    }
  });

  on('addActivity', async ()=>{
    const title=document.getElementById('acTitle').value.trim();
    const date=document.getElementById('acDate').value.trim();
    const desc=document.getElementById('acDesc').value.trim();
    if(!title) return alert('اكتب عنوان النشاط');
    const by=readBy('acBy'); if(!by) return;
    const ref = db.doc('activities/all');
    const cur = await ref.get();
    const items = (cur?.data()?.items)||[];
    items.push({title,date,desc,by,at:Date.now()});
    await ref.set({items});
    alert('تم النشر للجميع'); loadTab();
  });

  on('bulkAdd', async ()=>{
    const year = document.getElementById('bYear').value;
    const classLabel = document.getElementById('bClass').value.trim();
    const raw = document.getElementById('bNames').value;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return alert('اكتب الطلاب أولاً بالصيغة: الاسم | المسار | المادة');
    const btn = document.getElementById('bulkAdd'); btn.disabled=true; btn.textContent='جاري الحفظ...';
    const saved=[]; const errors=[]; let failed=false;
    const taken=new Set(); const byName={};
    try{
      ((await db.collection('students').get())?.docs||[]).forEach(d=>{ taken.add(d.id); byName[(d.data().name||'')+'|'+d.data().year]=d.id; });
    }catch(e){}
    for(const line of lines){
      const parts = line.split(/\s*[|\t,،/\\;؛]\s*/).map(p=>p.trim());
      if(parts.length<2 || !parts[0] || !parts[1]){ errors.push(line+'  ← لازم على الأقل: الاسم | المسار'); continue; }
      const [name, track, subject=''] = parts;
      const dupKey = name+'|'+year;
      if(byName[dupKey]){ errors.push(line+'  ← الاسم ده متسجل بالفعل بكود '+byName[dupKey]); continue; }
      const code = makeCode(track, taken);
      try{
        await db.doc('students/'+code).set({name, year:Number(year), classLabel, track, subject, system: TRACK_TO_SYSTEM[track]||''});
        byName[dupKey]=code;
        saved.push({name, track, subject, code});
      }catch(e){
        errors.push(line+'  ← فشل الحفظ (تأكدي من الـ Rules في Firebase)'); failed=true; break;
      }
    }
    btn.disabled=false; btn.textContent='حفظ كل الطلاب وعمل الأكواد';
    const msg = `<div class="card"><h3>تم حفظ ${saved.length} طالب ✅</h3>
      ${saved.length?`<div class="attach" style="margin:0 0 8px"><button class="small" id="copyCodes">نسخ الأكواد</button><button class="ghost small" id="dlCodes">تحميل ملف Excel</button></div>
      ${saved.map(x=>`<div class="item"><b>${esc(x.name)}</b> — <span dir="ltr" style="font-weight:700;color:var(--brand);letter-spacing:1px">${esc(x.code)}</span><div class="muted">${esc(x.track)}${x.subject?' - '+esc(x.subject):''}</div></div>`).join('')}`:''}
      ${errors.length?`<p style="color:var(--danger)"><b>${errors.length} سطر لم يتم حفظه:</b></p>${errors.map(e=>`<div class="item" style="color:var(--danger)">${esc(e)}</div>`).join('')}`:''}
      </div>`;
    const keepText = failed ? raw : lines.filter(l=>errors.some(e=>e.startsWith(l))).join('\n');
    await loadTab();
    const tArea=document.getElementById('bNames'); if(tArea) tArea.value=keepText;
    const r=document.getElementById('bulkResult'); if(!r) return;
    r.innerHTML=msg;
    const cp=document.getElementById('copyCodes'), dl=document.getElementById('dlCodes');
    if(cp) cp.onclick=async()=>{
      const txt = saved.map(x=>[x.name,x.track,x.subject,x.code].join('\t')).join('\n');
      try{ await navigator.clipboard.writeText(txt); alert('تم نسخ الأكواد'); }catch(e){ alert('النسخ مش شغال هنا، استخدمي تحميل Excel'); }
    };
    if(dl) dl.onclick=()=>{
      const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
      const csv='\ufeff'+'الاسم,المسار,المادة,الكود\n'+saved.map(x=>[x.name,x.track,x.subject,x.code].map(q).join(',')).join('\n');
      const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
      const a=document.createElement('a'); a.href=u; a.download='اكواد-الطلاب.csv'; document.body.appendChild(a); a.click(); a.remove();
    };
  });

  document.querySelectorAll('.delStudent').forEach(b=>b.onclick=async()=>{
    if(!confirm('متأكدة إنك عايزة تحذفي الطالبة دي؟')) return;
    await db.doc('students/'+b.dataset.code).delete();
    loadTab();
  });
  on('delAllStudents', async ()=>{
    if(!confirm('هيتم حذف كل الطلاب المسجلين نهائيًا، متأكدة؟')) return;
    const snap = await db.collection('students').get();
    for(const d of (snap?.docs||[])){ await db.doc('students/'+d.id).delete(); }
    loadTab();
  });
  on('exportStudentsExcel', async ()=>{
    const btn=document.getElementById('exportStudentsExcel'); btn.disabled=true; btn.textContent='جاري التجهيز...';
    try{
      const snap = await db.collection('students').get();
      const docs = snap?.docs||[];
      const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
      const rows = docs.map(d=>{ const x=d.data(); return [x.name,d.id,x.system||'',x.track||'',x.subject||'',x.classLabel||''].map(q).join(','); });
      const csv='\ufeff'+'الاسم,الكود,النظام,المسار,المادة,الفصل\n'+rows.join('\n');
      const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
      const a=document.createElement('a'); a.href=u; a.download='طلاب-مدرسة-احمد-زويل.csv'; document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ alert('فشل تجهيز الملف، حاولي تاني'); }
    btn.disabled=false; btn.textContent='📊 تحميل Excel (كل الطلاب)';
  });

  // ----- الجدول الدراسي -----
  on('uploadSchedule', async ()=>{
    const year=document.getElementById('scYear').value;
    const btn=document.getElementById('uploadSchedule'); btn.disabled=true; btn.textContent='جاري الحفظ...';
    try{
      const link=cleanLink(document.getElementById('scLink').value);
      const file=await readPdf('scFile', {allowImages:true});
      if(!file && !link) throw new Error('ارفعي ملف أو حطي رابط');
      const old = await db.doc('schedule/y'+year).get();
      if(file && old.exists && old.data().fileId) await deleteFile(old.data().fileId);
      await db.doc('schedule/y'+year).set({fileId:file?file.fileId:((old.data()||{}).fileId||''), fileName:file?file.fileName:((old.data()||{}).fileName||''), link, at:Date.now()});
      alert('تم حفظ الجدول'); loadTab();
    }catch(e){ alert(e.message||'حصل خطأ'); btn.disabled=false; btn.textContent='حفظ الجدول'; }
  });
  document.querySelectorAll('.delSchedule').forEach(b=>b.onclick=async()=>{
    if(!confirm('تأكيد حذف الجدول؟')) return;
    await db.doc('schedule/y'+b.dataset.year).set({fileId:'',fileName:'',link:''});
    if(b.dataset.fileid) await deleteFile(b.dataset.fileid);
    loadTab();
  });

  // ----- بيانات قيادة الفصول -----
  document.querySelectorAll('.saveClassInfo').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.key;
    const root=b.closest('.card');
    const captain=root.querySelector('.ciCaptain').value.trim();
    const secretary=root.querySelector('.ciSecretary').value.trim();
    const deputy=root.querySelector('.ciDeputy').value.trim();
    b.disabled=true; b.textContent='جاري الحفظ...';
    try{ await db.doc('classInfo/'+k).set({captain,secretary,deputy}); alert('تم الحفظ'); }
    catch(e){ alert('فشل الحفظ'); }
    b.disabled=false; b.textContent='حفظ بيانات الفصل';
  });

  // ----- الشات -----
  document.querySelectorAll('.pickGroup').forEach(b=>b.onclick=()=>{ activeGroupId=b.dataset.gid; loadTab(); });
  document.querySelectorAll('.openChatGroup').forEach(b=>b.onclick=()=>{ activeGroupId=b.dataset.gid; loadTab(); });
  const sendBtn=document.getElementById('sendChat');
  if(sendBtn) sendBtn.onclick=async()=>{
    const gid=sendBtn.dataset.gid;
    const inp=document.getElementById('chatInput');
    const text=inp.value.trim();
    if(!text) return;
    sendBtn.disabled=true;
    try{ await postGroupMessage(gid, text); inp.value=''; loadTab(); }
    catch(e){ alert('فشل الإرسال'); sendBtn.disabled=false; }
  };
  const chatInp=document.getElementById('chatInput');
  if(chatInp) chatInp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const sb=document.getElementById('sendChat'); if(sb) sb.click(); } });
  const refBtn=document.getElementById('refreshChat');
  if(refBtn) refBtn.onclick=()=>loadTab();
  document.querySelectorAll('.delMsg').forEach(b=>b.onclick=async()=>{
    if(!confirm('حذف الرسالة؟')) return;
    const gid=b.dataset.gid; const idx=Number(b.dataset.idx);
    const ref=db.doc('groupMessages/'+gid); const cur=await ref.get();
    const items=(cur?.data()?.items)||[]; items.splice(idx,1); await ref.set({items});
    loadTab();
  });
  on('createGroup', async ()=>{
    const name=document.getElementById('grpName').value.trim();
    const members=Array.from(document.querySelectorAll('.grpMember:checked')).map(c=>c.value);
    if(!name || !members.length) return alert('اكتبي اسم المجموعة واختاري طالب واحد على الأقل');
    const btn=document.getElementById('createGroup'); btn.disabled=true; btn.textContent='جاري الإنشاء...';
    try{
      const ref=db.doc('groups/list'); const cur=await ref.get();
      const items=(cur?.data()?.items)||[];
      const id='g'+Date.now().toString(36)+randPart(3);
      items.push({id,name,members,at:Date.now()});
      await ref.set({items});
      activeGroupId=id;
      alert('تم إنشاء المجموعة'); loadTab();
    }catch(e){ alert('فشل الإنشاء'); btn.disabled=false; btn.textContent='إنشاء المجموعة'; }
  });
  document.querySelectorAll('.delGroup').forEach(b=>b.onclick=async()=>{
    if(!confirm('حذف المجموعة نهائيًا؟')) return;
    const ref=db.doc('groups/list'); const cur=await ref.get();
    const items=((cur?.data()?.items)||[]).filter(g=>g.id!==b.dataset.gid);
    await ref.set({items});
    await db.doc('groupMessages/'+b.dataset.gid).delete();
    if(activeGroupId===b.dataset.gid) activeGroupId=null;
    loadTab();
  });
}

window.logout = logout;
render();
</script>
</body>
</html>
